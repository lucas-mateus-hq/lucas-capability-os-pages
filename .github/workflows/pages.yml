name: Publish Home Base to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate public snapshot boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f PROFILE_README_READY.md
          test -f package-lock.json
          test -f src/data/telemetry_source.json
          test -f src/components/CapabilityRegistry.astro
          test -f src/pages/index.astro
          test -f src/pages/portfolio/index.astro
          test -f public/telemetry.json
          test -f public/live-telemetry.js
          if grep -RInE 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{25,}' --exclude-dir=.git .; then
            echo 'POTENTIAL_SECRET_MATERIAL_DETECTED' >&2
            exit 1
          fi
          grep -q 'sanitized_public_snapshot' src/data/telemetry_source.json
          grep -q 'sanitized_public_snapshot' public/telemetry.json
          grep -q 'Capability Lab' src/pages/index.astro
          grep -q 'Lucas Mateus' src/pages/index.astro
          if grep -qiE 'runtime authority|canonical working state|Canonical public professional portfolio|credentials and internal evidence are not published' src/pages/index.astro src/pages/portfolio/index.astro README.md PROFILE_README_READY.md; then
            echo 'VISITOR_IRRELEVANT_INTERNAL_LANGUAGE_DETECTED' >&2
            exit 1
          fi
          echo 'PUBLIC_SURFACE_LANGUAGE_PASS'

      - name: Verify registry interaction contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-sort="name"' src/components/CapabilityRegistry.astro
          grep -q 'data-sort="status"' src/components/CapabilityRegistry.astro
          grep -q 'data-sort="ref"' src/components/CapabilityRegistry.astro
          grep -q "addEventListener('click'" src/components/CapabilityRegistry.astro
          grep -q 'aria-sort' src/components/CapabilityRegistry.astro
          grep -q 'DocumentFragment' src/components/CapabilityRegistry.astro
          grep -q 'table-layout:fixed' src/components/CapabilityRegistry.astro
          grep -q 'animate-pulse' src/components/CapabilityRegistry.astro
          grep -q 'capability:telemetry-mode' src/components/CapabilityRegistry.astro
          echo 'REGISTRY_INTERACTION_CONTRACT_PASS'

      - name: Verify sanitized REST telemetry adapter
        shell: bash
        run: |
          set -euo pipefail
          grep -q "live_public_snapshot" public/live-telemetry.js
          grep -q "sanitized_public_snapshot" public/live-telemetry.js
          grep -q "cache: 'no-store'" public/live-telemetry.js
          grep -q "credentials: 'omit'" public/live-telemetry.js
          grep -q "dispatchMode('fallback')" public/live-telemetry.js
          echo 'SANITIZED_REST_ADAPTER_PASS'

      - name: Install dependencies from lock
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Astro type and build gate
        run: npm run build

      - name: Verify generated registry
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/live-telemetry.js
          test -f dist/telemetry.json
          grep -q 'Capability registry' dist/index.html
          grep -q 'CAP-ASSESSMENT' dist/index.html
          grep -q 'data-capability-registry' dist/index.html
          echo 'CAPABILITY_REGISTRY_BUILD_PASS'

      - name: Verify recruiter-facing portfolio and search boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/portfolio/index.html
          grep -q '<title>Lucas Mateus — Talent Acquisition' dist/portfolio/index.html
          grep -q 'Recruiting Operations' dist/portfolio/index.html
          grep -q 'index,follow,max-image-preview:large' dist/portfolio/index.html
          grep -q 'https://lucas-mateus-hq.github.io/lucas-capability-os-pages/portfolio/' dist/portfolio/index.html
          grep -q 'https://www.linkedin.com/in/lucasmateus/' dist/portfolio/index.html
          grep -q 'Independent Applied R' dist/portfolio/index.html
          grep -q 'noindex,nofollow' dist/index.html
          grep -q './portfolio/' src/pages/index.astro
          echo 'RECRUITER_PORTFOLIO_SEARCH_BOUNDARY_PASS'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E sorting, filters, CLS and Live transition
        run: npm run test:e2e

      - name: Fresh-eyes desktop/mobile capture
        run: npm run test:fresh-eyes

      - name: Lighthouse desktop/mobile gate
        shell: bash
        run: |
          set -euo pipefail
          npm run preview > /tmp/home-base-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/lucas-capability-os-pages/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4321/lucas-capability-os-pages/ > /dev/null
          curl --fail --silent http://127.0.0.1:4321/lucas-capability-os-pages/portfolio/ > /dev/null
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          timeout 240s npx lhci autorun --config=./lighthouserc.desktop.cjs
          timeout 240s npx lhci autorun --config=./lighthouserc.mobile.cjs
          echo 'LIGHTHOUSE_DESKTOP_MOBILE_PASS'

      - name: Upload fresh-eyes and Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: home-base-ui-evidence
          path: |
            artifacts/fresh-eyes
            artifacts/lighthouse
            artifacts/playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies from lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build static site
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

# O que isso faz: valida o snapshot R&D, o portfólio profissional, seus limites de indexação e bloqueia padrões de credenciais reais antes de build, browser, fresh-eyes, Lighthouse e deploy.
